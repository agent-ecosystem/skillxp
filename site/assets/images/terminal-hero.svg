<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" role="img" aria-label="Terminal showing skillxp harnesses and observe commands" style="max-width:100%;height:auto">
  <rect x="0.5" y="0.5" width="559" height="343" rx="14" fill="#15171c" stroke="#2e323c"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>
  <text x="280" y="28" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b8b93">skillxp</text>
  <line x1="0.5" y1="44" x2="559.5" y2="44" stroke="#2e323c"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">
    <text x="24" y="74"><tspan fill="#4ade80">$</tspan><tspan fill="#e4e4e7" dx="8">skillxp harnesses</tspan></text>
    <text x="40" y="96"><tspan fill="#93c5fd">claude-code</tspan><tspan x="180" fill="#d4d4d8">.claude/skills</tspan></text>
    <text x="40" y="118"><tspan fill="#93c5fd">codex</tspan><tspan x="180" fill="#d4d4d8">.codex/skills</tspan></text>
    <text x="40" y="140"><tspan fill="#93c5fd">antigravity</tspan><tspan x="180" fill="#d4d4d8">.agents/skills</tspan></text>
    <text x="24" y="178"><tspan fill="#4ade80">$</tspan><tspan fill="#e4e4e7" dx="8">skillxp observe -harness claude-code \</tspan></text>
    <text x="48" y="200" fill="#e4e4e7">-install ./my-skill -activation \</text>
    <text x="48" y="222" fill="#e4e4e7">-trace "PHRASE-1234" -out out/</text>
    <text x="40" y="248"><tspan fill="#8b8b93">PHRASE-1234</tspan><tspan x="180" fill="#4ade80">harness-injected</tspan></text>
    <text x="40" y="270" fill="#8b8b93">observation.json  session.json</text>
    <text x="40" y="292" fill="#8b8b93">transcript archived (12 lines)</text>
    <text x="24" y="324"><tspan fill="#4ade80">$</tspan><tspan fill="#6b7280" dx="8">&#9608;</tspan></text>
